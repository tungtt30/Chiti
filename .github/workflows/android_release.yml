name: Android Automated Release

on:
  push:
    branches:
      - android-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis & Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Extract App Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: *//')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=v${VERSION//+/_}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.RELEASE_TAG }}
          name: "Release ${{ steps.get_version.outputs.APP_VERSION }} (Build #${{ github.run_number }})"
          body: |
            ## 📱 Android Release - ${{ steps.get_version.outputs.APP_VERSION }}
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Build Run:** #${{ github.run_number }}

            ### 📦 Artifacts:
            - `app-release.apk` (Universal APK for all Android architectures)
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
